<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Password-reset (?token=) and invite-register (?invite=) links arrive as a
      full document load. Apply no-referrer and strip the secret before favicon /
      module requests so it is not leaked via Referer and is handed to the SPA
      only in memory. Scoped to those paths so the rest of the app is unchanged.
    -->
    <script>
      (function () {
        try {
          var path = location.pathname || "";
          var isReset = path.indexOf("/reset-password") !== -1;
          var isRegister = path === "/register" || path.indexOf("/register/") === 0;
          if (!isReset && !isRegister) return;
          var meta = document.createElement("meta");
          meta.setAttribute("name", "referrer");
          meta.setAttribute("content", "no-referrer");
          document.head.appendChild(meta);
          var url = new URL(location.href);
          var changed = false;
          if (isReset) {
            var token = url.searchParams.get("token");
            if (token) {
              window.__SOMA_PASSWORD_RESET_TOKEN__ = token;
              url.searchParams.delete("token");
              changed = true;
            }
          }
          if (isRegister) {
            var invite = url.searchParams.get("invite");
            if (invite) {
              window.__SOMA_REGISTRATION_INVITE_TOKEN__ = invite;
              url.searchParams.delete("invite");
              changed = true;
            }
          }
          if (!changed) return;
          var query = url.searchParams.toString();
          history.replaceState(
            {},
            "",
            url.pathname + (query ? "?" + query : "") + url.hash,
          );
        } catch (_) {
          /* ignore — React capture remains as fallback */
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
