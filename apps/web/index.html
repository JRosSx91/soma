<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Match html lang to the persisted UI language before React boots.
      Storage key and ES/EN mapping must stay aligned with
      apps/web/src/i18n/interface-languages.ts and document-language.ts.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("soma.i18n.lang") || "";
          var nav =
            (navigator.languages && navigator.languages[0]) ||
            navigator.language ||
            "en";
          var raw = stored || nav;
          var code = String(raw).split("-")[0].toLowerCase();
          var iberian = { es: 1, ca: 1, gl: 1, eu: 1 };
          document.documentElement.lang = iberian[code] ? "es" : "en";
        } catch (_) {
          document.documentElement.lang = "en";
        }
      })();
    </script>
    <!--
      Password-reset (?token=) and invite-register (?invite=) links arrive as a
      full document load. Apply no-referrer and strip the secret before favicon /
      module requests so it is not leaked via Referer and is handed to the SPA
      only in memory. Scoped to those paths so the rest of the app is unchanged.
    -->
    <script>
      (function () {
        try {
          var path = location.pathname || "";
          var isReset = path.indexOf("/reset-password") !== -1;
          var isRegister = path === "/register" || path.indexOf("/register/") === 0;
          if (!isReset && !isRegister) return;
          var meta = document.createElement("meta");
          meta.setAttribute("name", "referrer");
          meta.setAttribute("content", "no-referrer");
          document.head.appendChild(meta);
          var url = new URL(location.href);
          var changed = false;
          if (isReset) {
            var token = url.searchParams.get("token");
            if (token) {
              window.__SOMA_PASSWORD_RESET_TOKEN__ = token;
              url.searchParams.delete("token");
              changed = true;
            }
          }
          if (isRegister) {
            var invite = url.searchParams.get("invite");
            if (invite) {
              window.__SOMA_REGISTRATION_INVITE_TOKEN__ = invite;
              url.searchParams.delete("invite");
              changed = true;
            }
          }
          if (!changed) return;
          var query = url.searchParams.toString();
          history.replaceState(
            {},
            "",
            url.pathname + (query ? "?" + query : "") + url.hash,
          );
        } catch (_) {
          /* ignore — React capture remains as fallback */
        }
      })();
    </script>

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <script id="soma-jsonld" type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Soma",
        "url": "https://somarecovery.app/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "description": "Soma is an educational web app for exploring modelled physiological recovery after substance use. Catalog curves are estimates, not diagnoses.",
        "offers": {
          "@type": "Offer",

          "priceCurrency": "EUR"

    </script>
    <!--
      SPA: every route serves this document. Static robots/canonical/og:url
      describe the public landing and remain valid without JavaScript.
      Production also sends X-Robots-Tag: noindex, nofollow on private paths
      (Render Headers; not in this file). This parser-blocking script only
      runs off `/`: HTML noindex and strip canonical/og:url/JSON-LD before React.
    -->
    <script>
      (function () {
        try {
          var path = location.pathname || "/";
          if (path.length > 1 && path.charAt(path.length - 1) === "/") {
            path = path.slice(0, -1);
          }
          if (path === "/" || path === "") return;
          var robots = document.querySelector('meta[name="robots"]');
          if (!robots) {
            robots = document.createElement("meta");
            robots.setAttribute("name", "robots");
            document.head.appendChild(robots);
          }
          robots.setAttribute("content", "noindex,nofollow");
          var canonical = document.querySelector('link[rel="canonical"]');
          if (canonical) canonical.parentNode.removeChild(canonical);
          var ogUrl = document.querySelector('meta[property="og:url"]');
          if (ogUrl) ogUrl.parentNode.removeChild(ogUrl);
          var jsonLd = document.getElementById("soma-jsonld");
          if (jsonLd) jsonLd.parentNode.removeChild(jsonLd);
        } catch (_) {
          /* keep static landing robots */
        }
      })();
    </script>
