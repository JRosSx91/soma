name: Database backups

on:
  schedule:
    # 03:00 UTC every day. GitHub may delay cron by several minutes.
    - cron: "0 3 * * *"
  workflow_dispatch:

# Scheduled jobs always use the workflow file on the repository default
# branch. This repository's default branch is main, which matches the
# production-backups environment restriction.
concurrency:
  group: soma-database-backups
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    name: Encrypted PostgreSQL dump to R2
    if: github.repository == 'JRosSx91/soma' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-backups
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install PostgreSQL 17 client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          test -x /usr/lib/postgresql/17/bin/pg_dump
          /usr/lib/postgresql/17/bin/pg_dump --version

      - name: Install age
        env:
          AGE_VERSION: "1.3.2"
          AGE_TARBALL_SHA256: "cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10"
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/age.tgz \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/age-v${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_TARBALL_SHA256}  /tmp/age.tgz" | sha256sum -c -
          tar -xzf /tmp/age.tgz -C /tmp
          sudo install -m 0755 /tmp/age/age /usr/local/bin/age
          rm -rf /tmp/age /tmp/age.tgz
          age --version

      - name: Verify AWS CLI
        run: |
          set -euo pipefail
          command -v aws
          aws --version

      - name: Dump, encrypt, and upload
        env:
          SUPABASE_BACKUP_DATABASE_URL: ${{ secrets.SUPABASE_BACKUP_DATABASE_URL }}
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: bash .github/scripts/backup-database.sh
